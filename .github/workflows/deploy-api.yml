name: Desplegar servicio del compendio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [portal-api.js, wrangler-portal.jsonc, .github/workflows/deploy-api.yml]
permissions:
  contents: read
concurrency:
  group: compendio-api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publicar servicio con prueba individual de push
        run: npx --yes wrangler@4 deploy --config wrangler-portal.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PORTAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cdd91f774a9320d0e412fb88ae107850
